<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WYW HERE | Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f2;
  color:#151515;
}

.topbar{
  background:#151515;
  color:#fff;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:700;
}

.logo span{
  font-weight:400;
}

.top-actions{
  display:flex;
  gap:15px;
  align-items:center;
}

.top-actions a,
.logout{
  color:#fff;
  background:none;
  border:0;
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
}

.container{
  max-width:1000px;
  margin:35px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 30px #0000000b;
  margin-bottom:22px;
}

h1,h2{
  margin-top:0;
}

.subtitle{
  color:#777;
}

.field{
  margin:16px 0;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:14px;
}

textarea{
  min-height:85px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  background:#151515;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.secondary{
  background:#eee;
  color:#151515;
}

.danger{
  background:#eee;
  color:#b00020;
}

.actions{
  display:flex;
  gap:10px;
}

.message{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:9px;
}

.success{
  background:#e8f7e8;
  color:#28752b;
}

.error{
  background:#ffe9e9;
  color:#a00000;
}

#app{
  display:none;
}

.login{
  max-width:430px;
  margin:100px auto;
  padding:0 20px;
}

.row{
  border:1px solid #eee;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.row h3{
  margin:0 0 5px;
  font-size:16px;
}

.row p{
  margin:0;
  color:#777;
  font-size:13px;
}

@media(max-width:600px){
  .row{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="logo">
    WYW<span>HERE</span>
  </div>

  <div class="top-actions">
    <a href="index.html">View Website</a>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<section id="login" class="login">

  <div class="card">

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to manage WYW HERE products.
    </p>

    <div id="loginError" class="message error"></div>

    <div class="field">

      <label>Email</label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter admin email"
      >

    </div>


    <div class="field">

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter admin password"
      >

    </div>


    <button
      id="loginBtn"
      class="btn"
      style="width:100%"
      onclick="login()"
    >
      LOGIN
    </button>

  </div>

</section>



<!-- =========================
     ADMIN APP
========================= -->

<section id="app" class="container">


  <div class="card">

    <h1 id="formTitle">
      Add Product
    </h1>

    <p class="subtitle">
      Create or update a product.
    </p>


    <div id="formError" class="message error"></div>

    <div id="success" class="message success"></div>


    <input
      type="hidden"
      id="editId"
    >


    <div class="field">

      <label>
        Product Name
      </label>

      <input
        id="name"
        placeholder="Premium Smart Watch"
      >

    </div>


    <div class="field">

      <label>
        Category
      </label>

      <select id="category">

        <option value="">
          Select Category
        </option>

        <option value="Gadgets">
          Gadgets
        </option>

        <option value="Watches">
          Watches
        </option>

        <option value="Kitchen">
          Kitchen
        </option>

        <option value="Home">
          Home
        </option>

        <option value="Fitness">
          Fitness
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Price
      </label>

      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="2999"
      >

    </div>


    <div class="field">

      <label>
        Product Image URL
      </label>

      <input
        id="image"
        type="url"
        placeholder="https://..."
      >

    </div>


    <div class="field">

      <label>
        Short Description
      </label>

      <textarea
        id="description"
        placeholder="Write 1-2 lines about the product"
      ></textarea>

    </div>


    <div class="field">

      <label>
        Affiliate Link
      </label>

      <input
        id="link"
        type="url"
        placeholder="Paste your affiliate link"
      >

    </div>


    <div class="actions">

      <button
        id="saveBtn"
        class="btn"
        onclick="saveProduct()"
      >
        SAVE PRODUCT
      </button>


      <button
        id="cancelBtn"
        class="btn secondary"
        style="display:none"
        onclick="resetForm()"
      >
        CANCEL EDIT
      </button>

    </div>

  </div>



  <div class="card">

    <h2>
      Products
    </h2>

    <div id="list">
      Loading...
    </div>

  </div>


</section>



<script>

/* =========================================
   SUPABASE SETTINGS
========================================= */

const SUPABASE_URL =
  "https://ncavpnittrdgylogbjfp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";

const ADMIN_EMAIL =
  "suryamjpru8953@gmail.com";


/* =========================================
   HELPERS
========================================= */

const $ = id =>
  document.getElementById(id);


function showMessage(id,text,type){

  const element = $(id);

  element.textContent = text;

  element.className =
    "message " + type;

  element.style.display =
    "block";
}


function hideMessage(id){

  $(id).style.display =
    "none";
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(match){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[match];

    });

}


/* =========================================
   AUTH TOKEN
========================================= */

function getAccessToken(){

  return sessionStorage.getItem(
    "wyw_access_token"
  );

}


/* =========================================
   SUPABASE AUTH LOGIN
========================================= */

async function login(){

  hideMessage("loginError");

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  const button =
    $("loginBtn");


  if(!email || !password){

    showMessage(
      "loginError",
      "Email and password are required.",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "LOGGING IN...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({

            email:email,

            password:password

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Invalid email or password."
      );

    }


    if(
      !data.user ||
      !data.user.email ||
      data.user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      throw new Error(
        "This account is not authorized as admin."
      );

    }


    sessionStorage.setItem(
      "wyw_access_token",
      data.access_token
    );


    sessionStorage.setItem(
      "wyw_refresh_token",
      data.refresh_token || ""
    );


    sessionStorage.setItem(
      "wyw_admin",
      "1"
    );


    showApp();


  }catch(error){

    console.error(error);

    showMessage(
      "loginError",
      error.message ||
      "Login failed.",
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "LOGIN";

  }

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  sessionStorage.removeItem(
    "wyw_access_token"
  );

  sessionStorage.removeItem(
    "wyw_refresh_token"
  );

  sessionStorage.removeItem(
    "wyw_admin"
  );

  location.reload();

}


/* =========================================
   AUTH CHECK
========================================= */

async function checkAdmin(){

  const token =
    getAccessToken();


  if(!token){

    return false;

  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {

          method:"GET",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }
      );


    if(!response.ok){

      return false;

    }


    const user =
      await response.json();


    if(
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      return false;

    }


    return true;


  }catch(error){

    console.error(error);

    return false;

  }

}


/* =========================================
   SHOW ADMIN APP
========================================= */

async function showApp(){

  const authorized =
    await checkAdmin();


  if(!authorized){

    logout();

    return;

  }


  $("login").style.display =
    "none";


  $("app").style.display =
    "block";


  loadProducts();

}


/* =========================================
   AUTH HEADERS
========================================= */

function authHeaders(){

  const token =
    getAccessToken();


  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + token,

    "Content-Type":
      "application/json"

  };

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const list =
    $("list");


  list.textContent =
    "Loading...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",

        {

          method:"GET",

          headers:authHeaders()

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.hint ||
        "Could not load products."
      );

    }


    renderProducts(data || []);


  }catch(error){

    console.error(error);

    list.innerHTML =
      "<p style='color:#b00020'>" +
      escapeHtml(error.message) +
      "</p>";

  }

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

  hideMessage("formError");

  hideMessage("success");


  const name =
    $("name").value.trim();

  const category =
    $("category").value.trim();

  const price =
    $("price").value.trim();

  const image =
    $("image").value.trim();

  const description =
    $("description").value.trim();

  const affiliateLink =
    $("link").value.trim();

  const editId =
    $("editId").value;


  if(
    !name ||
    !category ||
    !price ||
    !description ||
    !affiliateLink
  ){

    showMessage(
      "formError",
      "Please fill all required fields.",
      "error"
    );

    return;

  }


  const product = {

    name:name,

    category:category,

    price:Number(price),

    image_url:
      image || null,

    description:
      description,

    affiliate_link:
      affiliateLink

  };


  const button =
    $("saveBtn");


  button.disabled = true;

  button.textContent =
    editId ?
      "UPDATING..." :
      "SAVING...";


  try{

    let response;


    if(editId){

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          encodeURIComponent(editId),

          {

            method:"PATCH",

            headers:{
              ...authHeaders(),
              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify(product)

          }

        );

    }else{

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/products",

          {

            method:"POST",

            headers:{
              ...authHeaders(),
              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify(product)

          }

        );

    }


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        text ||
        "Could not save product."
      );

    }


    resetForm();


    showMessage(
      "success",
      editId ?
        "Product updated successfully." :
        "Product added successfully.",
      "success"
    );


    await loadProducts();


  }catch(error){

    console.error(error);

    showMessage(
      "formError",
      error.message ||
      "Could not save product.",
      "error"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "SAVE PRODUCT";

  }

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(product){

  $("formTitle").textContent =
    "Edit Product";


  $("editId").value =
    product.id;


  $("name").value =
    product.name || "";


  $("category").value =
    product.category || "";


  $("price").value =
    product.price ?? "";


  $("image").value =
    product.image_url || "";


  $("description").value =
    product.description || "";


  $("link").value =
    product.affiliate_link || "";


  $("cancelBtn").style.display =
    "inline-block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

  if(
    !confirm(
      "Delete this product?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        encodeURIComponent(id),

        {

          method:"DELETE",

          headers:{
            ...authHeaders(),
            "Prefer":
              "return=minimal"
          }

        }

      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        text ||
        "Delete failed."
      );

    }


    await loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "Delete failed: " +
      error.message
    );

  }

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(products){

  const list =
    $("list");


  if(!products.length){

    list.innerHTML =
      "<p class='subtitle'>" +
      "No products added yet." +
      "</p>";

    return;

  }


  list.innerHTML =
    products.map(function(product){

      return `

        <div class="row">

          <div>

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <p>
              ${escapeHtml(product.category)}
              · ₹${Number(product.price)
                .toLocaleString("en-IN")}
            </p>

          </div>


          <div class="actions">

            <button
              class="btn secondary"
              onclick="editProductById(${Number(product.id)})"
            >
              Edit
            </button>


            <button
              class="btn danger"
              onclick="deleteProduct(${Number(product.id)})"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================
   EDIT FROM LIST
========================================= */

let cachedProducts = [];


function editProductById(id){

  const product =
    cachedProducts.find(
      item => Number(item.id) === Number(id)
    );


  if(product){

    editProduct(product);

  }

}


/* =========================================
   RESET FORM
========================================= */

function resetForm(){

  $("editId").value =
    "";

  $("name").value =
    "";

  $("category").value =
    "";

  $("price").value =
    "";

  $("image").value =
    "";

  $("description").value =
    "";

  $("link").value =
    "";

  $("formTitle").textContent =
    "Add Product";

  $("cancelBtn").style.display =
    "none";

  hideMessage("formError");

}


/* =========================================
   OVERRIDE RENDER TO CACHE PRODUCTS
========================================= */

const originalRenderProducts =
  renderProducts;


renderProducts =
  function(products){

    cachedProducts =
      products;

    originalRenderProducts(
      products
    );

  };


/* =========================================
   INITIALIZE
========================================= */

async function init(){

  const authorized =
    await checkAdmin();


  if(authorized){

    $("login").style.display =
      "none";

    $("app").style.display =
      "block";

    await loadProducts();

  }else{

    $("login").style.display =
      "block";

    $("app").style.display =
      "none";

  }

}


init();

</script>

</body>
</html>
