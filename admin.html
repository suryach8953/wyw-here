<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WYW HERE | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f2;color:#151515}
.topbar{background:#151515;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:700}.logo span{font-weight:400}
.top-actions{display:flex;gap:15px;align-items:center}.top-actions a,.logout{color:#fff;background:none;border:0;cursor:pointer;text-decoration:none;font-size:14px}
.container{max-width:1000px;margin:35px auto;padding:0 20px}.card{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #0000000b;margin-bottom:22px}
h1,h2{margin-top:0}.subtitle{color:#777}.field{margin:16px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:14px}textarea{min-height:85px}
.btn{border:0;border-radius:9px;padding:12px 16px;background:#151515;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eee;color:#151515}.danger{background:#eee;color:#b00020}
.actions{display:flex;gap:10px}.message{display:none;margin-top:14px;padding:12px;border-radius:9px}.success{background:#e8f7e8;color:#28752b}.error{background:#ffe9e9;color:#a00000}
#app{display:none}.login{max-width:430px;margin:100px auto;padding:0 20px}.row{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:15px;align-items:center}.row h3{margin:0 0 5px;font-size:16px}.row p{margin:0;color:#777;font-size:13px}
@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap}}
</style></head>
<body>
<header class="topbar"><div class="logo">WYW<span>HERE</span></div><div class="top-actions"><a href="index.html">View Website</a><button class="logout" onclick="logout()">Logout</button></div></header>

<section id="login" class="login"><div class="card"><h1>Admin Login</h1><p class="subtitle">Sign in to manage WYW HERE products.</p>
<div id="loginError" class="message error"></div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"></div>
<button id="loginBtn" class="btn" style="width:100%" onclick="login()">LOGIN</button></div></section>

<section id="app" class="container"><div class="card">
<h1 id="formTitle">Add Product</h1><p class="subtitle">Create or update a product.</p>
<div id="formError" class="message error"></div><div id="success" class="message success"></div>
<input type="hidden" id="editId">
<div class="field"><label>Product Name</label><input id="name" placeholder="Premium Smart Watch"></div>
<div class="field"><label>Category</label><select id="category"><option value="">Select Category</option><option>Gadgets</option><option>Watches</option><option>Kitchen</option><option>Home</option><option>Fitness</option></select></div>
<div class="field"><label>Price</label><input id="price" type="number" min="0" step="0.01" placeholder="2999"></div>
<div class="field"><label>Product Image URL</label><input id="image" type="url" placeholder="https://..."></div>
<div class="field"><label>Short Description</label><textarea id="description" placeholder="Write 1-2 lines about the product"></textarea></div>
<div class="field"><label>Affiliate Link</label><input id="link" type="url" placeholder="Paste your affiliate link"></div>
<div class="actions"><button id="saveBtn" class="btn" onclick="saveProduct()">SAVE PRODUCT</button><button id="cancelBtn" class="btn secondary" style="display:none" onclick="resetForm()">CANCEL EDIT</button></div>
</div>
<div class="card"><h2>Products</h2><div id="list">Loading...</div></div></section>

<script>
const SUPABASE_URL="https://ncavpnittrdgylogbjfp.supabase.co";
const SUPABASE_KEY="sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";
const ADMIN_EMAIL="admin@wywhere.in";
const {createClient}=window.supabase;
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function msg(id,text,type){const e=$(id);e.textContent=text;e.className="message "+type;e.style.display="block"}
function hide(id){$(id).style.display="none"}

async function login(){
 hide("loginError");const email=$("email").value.trim(),password=$("password").value,btn=$("loginBtn");
 if(!email||!password){msg("loginError","Email and password are required.","error");return}
 btn.disabled=true;btn.textContent="LOGGING IN...";
 try{
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(!data.user||data.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await supabase.auth.signOut();throw new Error("This account is not authorized as admin.")}
  showApp();
 }catch(e){msg("loginError",e.message||"Invalid email or password.","error")}finally{btn.disabled=false;btn.textContent="LOGIN"}
}
async function logout(){await supabase.auth.signOut();location.reload()}
async function showApp(){if(!(await requireAdmin()))return;$("login").style.display="none";$("app").style.display="block";loadProducts()}
async function requireAdmin(){const {data:{user}}=await supabase.auth.getUser();if(!user||user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await supabase.auth.signOut();return false}return true}

async function loadProducts(){
 const list=$("list");list.textContent="Loading...";
 const {data,error}=await supabase.from("products").select("*").order("id",{ascending:false});
 if(error){list.innerHTML="<p style='color:#b00020'>"+esc(error.message)+"</p>";return}
 renderProducts(data||[]);
}
async function saveProduct(){
 hide("formError");hide("success");
 const product={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),image_url:$("image").value.trim()||null,description:$("description").value.trim(),affiliate_link:$("link").value.trim()};
 const editId=$("editId").value;
 if(!product.name||!product.category||!product.price||!product.description||!product.affiliate_link){msg("formError","Please fill all required fields.","error");return}
 $("saveBtn").disabled=true;
 try{
  const result=editId?await supabase.from("products").update(product).eq("id",editId):await supabase.from("products").insert(product);
  if(result.error)throw result.error;
  resetForm();msg("success",editId?"Product updated successfully.":"Product added successfully.","success");await loadProducts();
 }catch(e){msg("formError",e.message||"Could not save product.","error")}finally{$("saveBtn").disabled=false}
}
function editProduct(p){$("formTitle").textContent="Edit Product";$("editId").value=p.id;$("name").value=p.name||"";$("category").value=p.category||"";$("price").value=p.price??"";$("image").value=p.image_url||"";$("description").value=p.description||"";$("link").value=p.affiliate_link||"";$("cancelBtn").style.display="inline-block";scrollTo({top:0,behavior:"smooth"})}
async function deleteProduct(id){if(!confirm("Delete this product?"))return;const {error}=await supabase.from("products").delete().eq("id",id);if(error){alert("Delete failed: "+error.message);return}loadProducts()}
function renderProducts(ps){$("list").innerHTML=ps.length?ps.map(p=>`<div class="row"><div><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ₹${Number(p.price).toLocaleString("en-IN")}</p></div><div class="actions"><button class="btn secondary" onclick='editProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button><button class="btn danger" onclick="deleteProduct(${Number(p.id)})">Delete</button></div></div>`).join(""):"<p class='subtitle'>No products added yet.</p>"}
function resetForm(){$("editId").value="";$("name").value="";$("category").value="";$("price").value="";$("image").value="";$("description").value="";$("link").value="";$("formTitle").textContent="Add Product";$("cancelBtn").style.display="none";hide("formError")}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}
async function init(){const {data:{user}}=await supabase.auth.getUser();if(user&&user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase())showApp();else{$("login").style.display="block";$("app").style.display="none"}}
supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user)showApp()});
init();
</script></body></html>
