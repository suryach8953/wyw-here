<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WYW HERE | Product</title>

<link rel="stylesheet" href="style.css">

<style>
.detail{
  max-width:1100px;
  margin:60px auto;
  padding:0 6%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center
}

.detail-image{
  height:500px;
  background:#eee;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:cover
}

.placeholder{
  font-size:80px;
  color:#aaa
}

.detail-info .tag{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#777
}

.detail-info h1{
  font-family:"Space Grotesk",sans-serif;
  font-size:52px;
  line-height:1;
  margin:12px 0;
  letter-spacing:-2px
}

.detail-price{
  font-size:25px;
  font-weight:700;
  margin:18px 0
}

.detail-desc{
  color:#666;
  line-height:1.7;
  max-width:520px
}

.buy-large{
  display:inline-block;
  margin-top:25px;
  background:#151515;
  color:#fff;
  text-decoration:none;
  padding:16px 28px;
  border-radius:12px;
  font-weight:700
}

.back-link{
  display:inline-block;
  margin-top:20px;
  color:#555;
  text-decoration:none;
  font-size:14px
}

.not-found{
  max-width:700px;
  margin:100px auto;
  padding:30px;
  text-align:center
}

@media(max-width:750px){
  .detail{
    grid-template-columns:1fr;
    margin-top:35px;
    gap:30px
  }

  .detail-image{
    height:350px
  }

  .detail-info h1{
    font-size:40px
  }
}
</style>
</head>

<body>

<header class="header">

<a class="logo" href="index.html">
WYW<span>HERE</span>
</a>

<nav>
<a href="index.html#products">Products</a>
<a href="index.html#categories">Categories</a>
</nav>

</header>

<main id="content"></main>

<script>

const SUPABASE_URL =
"https://ncavpnittrdgylogbjfp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";


const content = document.getElementById("content");

const id =
new URLSearchParams(location.search).get("id");


async function loadProduct(){

  try{

    if(!id){
      showNotFound();
      return;
    }

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=*`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if(!response.ok){
      throw new Error(await response.text());
    }

    const data = await response.json();

    if(!data.length){
      showNotFound();
      return;
    }

    const p = data[0];

    document.title = "WYW HERE | " + p.name;

    content.innerHTML = `

      <section class="detail">

        <div class="detail-image">

          ${
            p.image_url
            ?
            `<img
              src="${escapeHtml(p.image_url)}"
              alt="${escapeHtml(p.name)}"
            >`
            :
            `<div class="placeholder">✦</div>`
          }

        </div>


        <div class="detail-info">

          <span class="tag">
            ${escapeHtml(p.category)}
          </span>

          <h1>
            ${escapeHtml(p.name)}
          </h1>

          <div class="detail-price">
            ₹${Number(p.price).toLocaleString("en-IN")}
          </div>

          <p class="detail-desc">
            ${escapeHtml(p.description || "")}
          </p>

          <a
            class="buy-large"
            href="${escapeHtml(p.affiliate_link)}"
            target="_blank"
            rel="nofollow sponsored noopener"
          >
            CHECK PRICE / BUY NOW ↗
          </a>

          <br>

          <a
            class="back-link"
            href="index.html"
          >
            ← Back to products
          </a>

        </div>

      </section>

    `;

  }

  catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="not-found">

        <h1>Something went wrong</h1>

        <p>
          Product load nahi ho raha.
        </p>

        <a
          class="back-link"
          href="index.html"
        >
          ← Back to products
        </a>

      </div>
    `;
  }
}


function showNotFound(){

  content.innerHTML = `
    <div class="not-found">

      <h1>Product not found</h1>

      <p>
        Please go back and choose another product.
      </p>

      <a
        class="back-link"
        href="index.html"
      >
        ← Back to products
      </a>

    </div>
  `;
}


function escapeHtml(value){

  return String(value || "").replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


loadProduct();

</script>

</body>
</html>
