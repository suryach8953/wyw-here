<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="description"
    content="Discover this product on WYW HERE."
  >

  <title>WYW HERE | Product</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    :root{

      --bg:#f7f7f3;
      --white:#ffffff;

      --black:#111111;
      --dark:#191917;

      --text:#232320;
      --muted:#777770;
      --muted2:#9a9a91;

      --line:#e4e4dc;

      --accent:#ff6b35;
      --accent-soft:#fff0e9;

      --green:#d9f99d;

      --radius:26px;

      --shadow:
        0 18px 50px rgba(0,0,0,.07);

      --shadow-hover:
        0 25px 65px rgba(0,0,0,.12);

    }


    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }


    html{
      scroll-behavior:smooth;
    }


    body{

      font-family:
        "DM Sans",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 0%,
          #fff 0,
          #f7f7f3 38%,
          #f4f4ef 100%
        );

      color:var(--text);

      min-height:100vh;

    }


    a{
      text-decoration:none;
    }


    button,
    input{
      font:inherit;
    }


    /* ==================================================
       TOP BAR
    ================================================== */

    .topbar{

      min-height:38px;

      padding:8px 20px;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#111;

      color:#fff;

      font-size:10px;

      letter-spacing:1px;

      text-align:center;

    }


    .topbar-dot{

      width:6px;
      height:6px;

      margin-right:8px;

      background:#ff6b35;

      border-radius:50%;

      animation:
        pulse 1.7s infinite;

    }


    @keyframes pulse{

      0%,
      100%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.45);
      }

    }


    /* ==================================================
       HEADER
    ================================================== */

    .header{

      position:sticky;

      top:0;

      z-index:1000;

      min-height:78px;

      padding:
        0 5.5%;

      display:flex;

      align-items:center;

      justify-content:space-between;

      background:
        rgba(247,247,243,.88);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid rgba(228,228,220,.85);

    }


    .logo{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:25px;

      line-height:1;

      font-weight:700;

      color:#111;

      letter-spacing:-1.8px;

    }


    .logo span{

      color:#888880;

      font-weight:400;

    }


    .header-right{

      display:flex;

      align-items:center;

      gap:12px;

    }


    .header-link{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      min-height:40px;

      padding:
        0 14px;

      border:
        1px solid var(--line);

      background:#fff;

      color:#45453f;

      border-radius:999px;

      font-size:11px;

      font-weight:700;

      transition:.2s ease;

    }


    .header-link:hover{

      transform:translateY(-2px);

      border-color:#cfcfc7;

    }


    .mobile-home{

      display:none;

    }


    /* ==================================================
       PAGE WRAPPER
    ================================================== */

    .page{

      max-width:1280px;

      margin:0 auto;

      padding:
        28px 5.5%
        85px;

    }


    /* ==================================================
       BREADCRUMB
    ================================================== */

    .breadcrumb{

      display:flex;

      align-items:center;

      gap:8px;

      margin:
        9px 0 28px;

      color:#9a9a92;

      font-size:10px;

      font-weight:600;

    }


    .breadcrumb a{

      color:#777770;

      transition:.2s ease;

    }


    .breadcrumb a:hover{

      color:#111;

    }


    .breadcrumb-current{

      max-width:300px;

      white-space:nowrap;

      overflow:hidden;

      text-overflow:ellipsis;

    }


    /* ==================================================
       PRODUCT DETAIL
    ================================================== */

    .product-detail{

      display:grid;

      grid-template-columns:
        minmax(0,1.03fr)
        minmax(0,.97fr);

      gap:65px;

      align-items:start;

    }


    /* ==================================================
       GALLERY
    ================================================== */

    .gallery{

      position:sticky;

      top:105px;

    }


    .main-image-box{

      position:relative;

      width:100%;

      aspect-ratio:1 / 1;

      overflow:hidden;

      border-radius:32px;

      background:
        linear-gradient(
          135deg,
          #efefea,
          #dfdfd8
        );

      border:
        1px solid var(--line);

      box-shadow:
        var(--shadow);

    }


    .main-image-box img{

      width:100%;
      height:100%;

      object-fit:cover;

      display:block;

      transition:
        transform .45s ease;

    }


    .main-image-box:hover
    img{

      transform:
        scale(1.025);

    }


    .gallery-label{

      position:absolute;

      left:16px;
      top:16px;

      z-index:5;

      padding:
        8px 11px;

      border-radius:999px;

      background:
        rgba(17,17,17,.84);

      color:#fff;

      backdrop-filter:
        blur(10px);

      font-size:8px;

      font-weight:700;

      text-transform:uppercase;

      letter-spacing:1.3px;

    }


    .gallery-count{

      position:absolute;

      right:16px;
      top:16px;

      z-index:5;

      padding:
        8px 11px;

      border-radius:999px;

      background:
        rgba(255,255,255,.9);

      color:#444;

      backdrop-filter:
        blur(10px);

      font-size:9px;

      font-weight:700;

    }


    .gallery-btn{

      position:absolute;

      top:50%;

      transform:
        translateY(-50%);

      z-index:10;

      width:43px;
      height:43px;

      border:0;

      border-radius:50%;

      background:
        rgba(17,17,17,.78);

      color:#fff;

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:22px;

      cursor:pointer;

      backdrop-filter:
        blur(8px);

      transition:
        transform .2s ease,
        background .2s ease;

    }


    .gallery-btn:hover{

      background:#111;

      transform:
        translateY(-50%) scale(1.05);

    }


    .gallery-prev{
      left:15px;
    }


    .gallery-next{
      right:15px;
    }


    .thumbnails{

      display:flex;

      gap:10px;

      overflow-x:auto;

      scrollbar-width:none;

      margin-top:14px;

      padding:
        3px 2px 5px;

    }


    .thumbnails::-webkit-scrollbar{
      display:none;
    }


    .thumbnail{

      position:relative;

      width:76px;
      height:76px;

      flex:
        0 0 76px;

      overflow:hidden;

      border-radius:14px;

      border:
        2px solid transparent;

      background:#ededE8;

      cursor:pointer;

      transition:.2s ease;

    }


    .thumbnail:hover{

      transform:
        translateY(-2px);

    }


    .thumbnail.active{

      border-color:#111;

      box-shadow:
        0 6px 15px rgba(0,0,0,.08);

    }


    .thumbnail img{

      width:100%;
      height:100%;

      object-fit:cover;

    }


    /* ==================================================
       PRODUCT INFORMATION
    ================================================== */

    .product-info{

      padding:
        8px 0 0;

    }


    .category-pill{

      display:inline-flex;

      align-items:center;

      gap:7px;

      padding:
        8px 11px;

      background:
        var(--accent-soft);

      color:#c65329;

      border-radius:999px;

      font-size:9px;

      font-weight:700;

      text-transform:uppercase;

      letter-spacing:1.3px;

    }


    .category-pill::before{

      content:"";

      width:5px;
      height:5px;

      background:
        var(--accent);

      border-radius:50%;

    }


    .product-title{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:
        clamp(42px,5.2vw,72px);

      line-height:.94;

      letter-spacing:-4px;

      margin:
        20px 0 18px;

      color:#121210;

    }


    .product-description{

      color:#74746d;

      font-size:14px;

      line-height:1.8;

      max-width:590px;

    }


    .price-box{

      margin-top:28px;

      padding:
        20px 0;

      border-top:
        1px solid var(--line);

      border-bottom:
        1px solid var(--line);

    }


    .price-label{

      display:block;

      color:#a0a099;

      font-size:9px;

      font-weight:700;

      letter-spacing:1.5px;

      text-transform:uppercase;

      margin-bottom:7px;

    }


    .price{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:28px;

      font-weight:700;

      letter-spacing:-1px;

      color:#111;

    }


    .buy-area{

      margin-top:23px;

    }


    .buy-btn{

      width:100%;

      min-height:58px;

      border:0;

      border-radius:15px;

      background:#111;

      color:#fff;

      display:flex;

      align-items:center;

      justify-content:center;

      gap:10px;

      cursor:pointer;

      font-size:12px;

      font-weight:700;

      letter-spacing:.5px;

      box-shadow:
        0 14px 32px rgba(0,0,0,.12);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;

    }


    .buy-btn:hover{

      transform:
        translateY(-3px);

      background:#252522;

      box-shadow:
        0 19px 38px rgba(0,0,0,.17);

    }


    .buy-btn:active{

      transform:
        translateY(0);

    }


    .buy-subtext{

      margin-top:9px;

      text-align:center;

      color:#9a9a92;

      font-size:9px;

    }


    .feature-strip{

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:9px;

      margin-top:25px;

    }


    .feature{

      border:
        1px solid var(--line);

      border-radius:15px;

      background:#fff;

      padding:
        14px 12px;

      text-align:center;

    }


    .feature-icon{

      font-size:16px;

      margin-bottom:6px;

    }


    .feature strong{

      display:block;

      font-size:10px;

      margin-bottom:3px;

    }


    .feature span{

      display:block;

      color:#96968f;

      font-size:8px;

      line-height:1.4;

    }


    .share-row{

      margin-top:22px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:15px;

      flex-wrap:wrap;

    }


    .share-label{

      color:#92928b;

      font-size:9px;

      font-weight:700;

      text-transform:uppercase;

      letter-spacing:1px;

    }


    .copy-btn{

      border:
        1px solid var(--line);

      background:#fff;

      color:#45453f;

      padding:
        9px 12px;

      border-radius:10px;

      font-size:9px;

      font-weight:700;

      cursor:pointer;

      transition:.2s ease;

    }


    .copy-btn:hover{

      transform:
        translateY(-1px);

      border-color:#cfcfc7;

    }


    /* ==================================================
       RELATED PRODUCTS
    ================================================== */

    .related-section{

      margin-top:110px;

    }


    .section-header{

      display:flex;

      align-items:flex-end;

      justify-content:space-between;

      gap:25px;

      margin-bottom:25px;

    }


    .eyebrow{

      color:#999990;

      font-size:9px;

      text-transform:uppercase;

      font-weight:700;

      letter-spacing:2px;

      margin-bottom:7px;

    }


    .section-title{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:
        clamp(31px,4vw,47px);

      line-height:1;

      letter-spacing:-2.5px;

    }


    .section-link{

      display:inline-flex;

      align-items:center;

      gap:6px;

      color:#5b5b55;

      font-size:10px;

      font-weight:700;

      transition:.2s ease;

    }


    .section-link:hover{

      color:#111;

      transform:
        translateX(2px);

    }


    .related-grid{

      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:16px;

    }


    .related-card{

      background:#fff;

      border:
        1px solid var(--line);

      border-radius:21px;

      overflow:hidden;

      transition:
        transform .27s ease,
        box-shadow .27s ease;

    }


    .related-card:hover{

      transform:
        translateY(-5px);

      box-shadow:
        var(--shadow-hover);

    }


    .related-image{

      height:225px;

      overflow:hidden;

      background:
        linear-gradient(
          135deg,
          #eeeeE9,
          #dfdfda
        );

    }


    .related-image img{

      width:100%;
      height:100%;

      object-fit:cover;

      display:block;

      transition:
        transform .45s ease;

    }


    .related-card:hover
    .related-image img{

      transform:
        scale(1.05);

    }


    .related-content{

      padding:
        15px;

    }


    .related-category{

      color:#999991;

      font-size:8px;

      font-weight:700;

      text-transform:uppercase;

      letter-spacing:1.2px;

      margin-bottom:7px;

    }


    .related-name{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:16px;

      line-height:1.18;

      letter-spacing:-.5px;

      display:
        -webkit-box;

      -webkit-line-clamp:2;

      -webkit-box-orient:vertical;

      overflow:hidden;

      min-height:38px;

    }


    .related-bottom{

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      margin-top:13px;

    }


    .related-price{

      font-size:12px;

      font-weight:700;

    }


    .related-view{

      width:31px;
      height:31px;

      border:
        1px solid var(--line);

      border-radius:9px;

      display:flex;

      align-items:center;

      justify-content:center;

      color:#444;

      font-weight:700;

      font-size:12px;

    }


    /* ==================================================
       LOADING
    ================================================== */

    .loading-page{

      min-height:
        70vh;

      display:flex;

      align-items:center;

      justify-content:center;

    }


    .loader{

      width:34px;
      height:34px;

      border:
        3px solid #e3e3dc;

      border-top-color:#111;

      border-radius:50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin{

      to{
        transform:rotate(360deg);
      }

    }


    /* ==================================================
       NOT FOUND / ERROR
    ================================================== */

    .state{

      min-height:
        65vh;

      display:flex;

      align-items:center;

      justify-content:center;

      text-align:center;

      padding:60px 20px;

    }


    .state-inner{

      max-width:500px;

    }


    .state-icon{

      width:65px;
      height:65px;

      margin:
        0 auto 17px;

      display:flex;

      align-items:center;
      justify-content:center;

      border-radius:50%;

      background:#efefe9;

      font-size:23px;

    }


    .state h1{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:40px;

      letter-spacing:-2px;

      margin-bottom:9px;

    }


    .state p{

      color:#85857f;

      font-size:12px;

      line-height:1.6;

    }


    .state a{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      margin-top:20px;

      background:#111;

      color:#fff;

      padding:
        12px 17px;

      border-radius:999px;

      font-size:10px;

      font-weight:700;

    }


    /* ==================================================
       FOOTER
    ================================================== */

    footer{

      background:#111;

      color:#777770;

      padding:
        42px 5.5%
        27px;

    }


    .footer-inner{

      max-width:1280px;

      margin:0 auto;

      display:flex;

      justify-content:space-between;

      align-items:flex-start;

      gap:30px;

    }


    .footer-logo{

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:21px;

      font-weight:700;

      color:#fff;

      letter-spacing:-1px;

    }


    .footer-logo span{

      color:#81817a;

      font-weight:400;

    }


    .footer-tag{

      max-width:340px;

      margin-top:8px;

      color:#777770;

      font-size:10px;

      line-height:1.6;

    }


    .footer-links{

      display:flex;

      gap:23px;

      flex-wrap:wrap;

    }


    .footer-links a{

      color:#999991;

      font-size:10px;

      font-weight:600;

    }


    .footer-links a:hover{

      color:#fff;

    }


    .footer-disclosure{

      max-width:1280px;

      margin:
        25px auto 0;

      padding-top:18px;

      border-top:
        1px solid #252525;

      font-size:9px;

      line-height:1.7;

      color:#65655f;

    }


    /* ==================================================
       RESPONSIVE
    ================================================== */

    @media(max-width:1000px){

      .product-detail{

        grid-template-columns:
          1fr;

        gap:40px;

      }


      .gallery{

        position:relative;

        top:auto;

      }


      .main-image-box{

        max-width:720px;

      }


      .related-grid{

        grid-template-columns:
          repeat(3,1fr);

      }

    }


    @media(max-width:720px){

      .header{

        min-height:68px;

        padding:
          0 5%;

      }


      .header-right .header-link{

        display:none;

      }


      .mobile-home{

        display:inline-flex;

      }


      .page{

        padding:
          18px 5%
          65px;

      }


      .breadcrumb{

        margin:
          6px 0 20px;

      }


      .product-title{

        font-size:
          clamp(39px,13vw,58px);

        letter-spacing:-3px;

      }


      .product-description{

        font-size:13px;

      }


      .main-image-box{

        border-radius:23px;

      }


      .thumbnail{

        width:63px;
        height:63px;

        flex-basis:63px;

      }


      .feature-strip{

        grid-template-columns:
          repeat(3,1fr);

      }


      .related-section{

        margin-top:75px;

      }


      .section-header{

        align-items:flex-start;

        flex-direction:column;

        gap:10px;

      }


      .related-grid{

        grid-template-columns:
          repeat(2,1fr);

        gap:12px;

      }


      .related-image{

        height:190px;

      }


      .related-content{

        padding:12px;

      }


      .related-name{

        font-size:14px;

      }


      .footer-inner{

        flex-direction:column;

      }

    }


    @media(max-width:440px){

      .topbar{

        font-size:8px;

      }


      .gallery-btn{

        width:39px;
        height:39px;

      }


      .feature-strip{

        gap:6px;

      }


      .feature{

        padding:
          11px 7px;

      }


      .feature strong{

        font-size:9px;

      }


      .feature span{

        font-size:7px;

      }


      .related-image{

        height:165px;

      }

    }

  </style>

</head>

    let currentProduct = null;

    let galleryImages = [];

    let currentImage = 0;


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value){

      return String(value ?? "")
        .replace(
          /[&<>"']/g,
          function(match){

            return {

              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              '"':"&quot;",
              "'":"&#039;"

            }[match];

          }
        );

    }


    function formatPrice(value){

      const number =
        Number(value || 0);

      return (
        "₹" +
        number.toLocaleString(
          "en-IN",
          {
            maximumFractionDigits:2
          }
        )
      );

    }


    /* =====================================================
       AFFILIATE CLICK TRACKING
    ===================================================== */

    async function trackAffiliateClick(){

      try{

        if(!currentProduct){

          return false;

        }


        const response =
          await fetch(

            `${SUPABASE_URL}/rest/v1/affiliate_clicks`,

            {

              method:"POST",

              headers:{

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,

                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=minimal"

              },

              body:
                JSON.stringify({

                  product_id:
                    currentProduct.id,

                  product_name:
                    currentProduct.name

                }),

              keepalive:true

            }

          );


        return response.ok;

      }

      catch(error){

        console.error(
          "Affiliate tracking error:",
          error
        );

        return false;

      }

    }


    /* =====================================================
       BUY NOW
    ===================================================== */

    async function handleBuy(){

      if(!currentProduct){

        return;

      }


      const affiliateLink =
        currentProduct.affiliate_link;


      if(!affiliateLink){

        alert(
          "Affiliate link is not available for this product."
        );

        return;

      }


      /*
       * New tab immediately.
       * User click gesture ke andar open hota hai.
       */

      const newWindow =
        window.open(
          "about:blank",
          "_blank"
        );


      /*
       * Tracking.
       */

      await trackAffiliateClick();


      /*
       * Amazon / affiliate destination.
       */

      if(newWindow){

        newWindow.location.href =
          affiliateLink;

      }

      else{

        window.location.href =
          affiliateLink;

      }

    }


    /* =====================================================
       GALLERY
    ===================================================== */

    function selectImage(index){

      if(
        index < 0 ||
        index >= galleryImages.length
      ){

        return;

      }


      currentImage =
        index;


      updateGallery();

    }


    function nextImage(){

      if(
        galleryImages.length <= 1
      ){

        return;

      }


      currentImage =
        (
          currentImage + 1
        ) %
        galleryImages.length;


      updateGallery();

    }


    function previousImage(){

      if(
        galleryImages.length <= 1
      ){

        return;

      }


      currentImage =
        (
          currentImage -
          1 +
          galleryImages.length
        ) %
        galleryImages.length;


      updateGallery();

    }


    function updateGallery(){

      const image =
        document.getElementById(
          "mainProductImage"
        );


      if(image){

        image.src =
          galleryImages[currentImage];

      }


      document
        .querySelectorAll(
          ".thumbnail"
        )
        .forEach(
          (thumbnail,index) => {

            thumbnail.classList.toggle(
              "active",
              index === currentImage
            );

          }
        );


      const counter =
        document.getElementById(
          "galleryCounter"
        );


      if(counter){

        counter.textContent =
          `${currentImage + 1} / ${galleryImages.length}`;

      }

    }


    /* =====================================================
       COPY PRODUCT LINK
    ===================================================== */

    async function copyProductLink(){

      try{

        await navigator.clipboard.writeText(
          window.location.href
        );


        const button =
          document.getElementById(
            "copyBtn"
          );


        if(button){

          const oldText =
            button.textContent;


          button.textContent =
            "Copied ✓";


          setTimeout(
            () => {

              button.textContent =
                oldText;

            },
            1600
          );

        }

      }

      catch(error){

        console.error(
          "Copy failed:",
          error
        );

      }

    }


    /* =====================================================
       LOAD RELATED PRODUCTS
    ===================================================== */

    async function loadRelatedProducts(){

      if(!currentProduct){

        return;

      }


      try{

        const category =
          currentProduct.category ||
          "";


        const url =

          `${SUPABASE_URL}/rest/v1/products` +

          `?select=id,name,category,price,image_url` +

          `&category=eq.${encodeURIComponent(category)}` +

          `&id=neq.${encodeURIComponent(currentProduct.id)}` +

          `&order=id.desc` +

          `&limit=4`;


        const response =
          await fetch(

            url,

            {

              headers:{

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`

              }

            }

          );


        if(!response.ok){

          return;

        }


        const products =
          await response.json();


        const container =
          document.getElementById(
            "relatedGrid"
          );


        if(!container){

          return;

        }


        if(!products.length){

          document
            .getElementById(
              "relatedSection"
            )
            ?.remove();

          return;

        }


        container.innerHTML =
          products.map(
            product => `

              <article class="related-card">

                <a
                  href="product.html?id=${encodeURIComponent(product.id)}"
                >

                  <div class="related-image">

                    ${
                      product.image_url

                      ?

                      `
                        <img
                          src="${escapeHtml(
                            product.image_url
                          )}"
                          alt="${escapeHtml(
                            product.name
                          )}"
                          loading="lazy"
                        >
                      `

                      :

                      `
                        <div
                          style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:30px;
                            color:#aaa;
                          "
                        >
                          ✦
                        </div>
                      `

                    }

                  </div>


                  <div class="related-content">

                    <div class="related-category">

                      ${escapeHtml(
                        product.category
                      )}

                    </div>


                    <div class="related-name">

                      ${escapeHtml(
                        product.name
                      )}

                    </div>


                    <div class="related-bottom">

                      <div class="related-price">

                        ${formatPrice(
                          product.price
                        )}

                      </div>


                      <div class="related-view">

                        →

                      </div>

                    </div>

                  </div>

                </a>

              </article>

            `
          ).join("");


      }

      catch(error){

        console.error(
          "Related products error:",
          error
        );

      }

    }


    /* =====================================================
       RENDER PRODUCT
    ===================================================== */

    function renderProduct(product){

      galleryImages = [

        product.image_url,
        product.image_2,
        product.image_3,
        product.image_4,
        product.image_5

      ].filter(
        image =>
          image &&
          String(image).trim()
      );


      currentImage = 0;


      const hasMultipleImages =
        galleryImages.length > 1;


      app.innerHTML = `

        <div class="page">


          <!-- ================================
               BREADCRUMB
          ================================= -->

          <div class="breadcrumb">

            <a href="index.html">
              Home
            </a>

            <span>›</span>

            <a href="index.html#categories">
              ${escapeHtml(
                product.category || "Products"
              )}
            </a>

            <span>›</span>

            <span class="breadcrumb-current">
              ${escapeHtml(
                product.name
              )}
            </span>

          </div>



          <!-- ================================
               PRODUCT DETAIL
          ================================= -->

          <section class="product-detail">


            <!-- ==============================
                 GALLERY
            =============================== -->

            <div class="gallery">


              <div class="main-image-box">


                <div class="gallery-label">
                  WYW PICK
                </div>


                ${
                  galleryImages.length
                    ? `

                      <img
                        id="mainProductImage"
                        src="${escapeHtml(
                          galleryImages[0]
                        )}"
                        alt="${escapeHtml(
                          product.name
                        )}"
                      >

                    `
                    : `

                      <div
                        style="
                          width:100%;
                          height:100%;
                          display:flex;
                          align-items:center;
                          justify-content:center;
                          color:#aaa;
                          font-size:70px;
                        "
                      >
                        ✦
                      </div>

                    `
                }


                ${
                  hasMultipleImages

                    ? `

                      <div
                        class="gallery-count"
                        id="galleryCounter"
                      >
                        1 / ${galleryImages.length}
                      </div>


                      <button
                        type="button"
                        class="gallery-btn gallery-prev"
                        onclick="previousImage()"
                        aria-label="Previous image"
                      >
                        ‹
                      </button>


                      <button
                        type="button"
                        class="gallery-btn gallery-next"
                        onclick="nextImage()"
                        aria-label="Next image"
                      >
                        ›
                      </button>

                    `

                    : ""

                }

              </div>



              ${
                hasMultipleImages

                  ? `

                    <div class="thumbnails">

                      ${galleryImages.map(
                        (image,index) => `

                          <div
                            class="thumbnail ${
                              index === 0
                                ? "active"
                                : ""
                            }"
                            onclick="selectImage(${index})"
                          >

                            <img
                              src="${escapeHtml(
                                image
                              )}"
                              alt="Product image ${index + 1}"
                              loading="lazy"
                            >

                          </div>

                        `
                      ).join("")}

                    </div>

                  `

                  : ""

              }


            </div>



            <!-- ==============================
                 INFORMATION
            =============================== -->

            <div class="product-info">


              <div class="category-pill">

                ${escapeHtml(
                  product.category ||
                  "Product"
                )}

              </div>


              <h1 class="product-title">

                ${escapeHtml(
                  product.name
                )}

              </h1>


              <p class="product-description">

                ${escapeHtml(
                  product.description ||
                  "A useful find worth checking out."
                )}

              </p>


              <div class="price-box">

                <span class="price-label">
                  Current listed price
                </span>

                <div class="price">

                  ${formatPrice(
                    product.price
                  )}

                </div>

              </div>


              <!-- ===========================
                   BUY
              ============================ -->

              <div class="buy-area">


                <button
                  class="buy-btn"
                  type="button"
                  onclick="handleBuy()"
                >

                  CHECK PRICE / BUY NOW

                  <span>
                    ↗
                  </span>

                </button>


                <div class="buy-subtext">

                  You'll be redirected to the retailer.

                </div>

              </div>



              <!-- ===========================
                   FEATURES
              ============================ -->

              <div class="feature-strip">


                <div class="feature">

                  <div class="feature-icon">
                    ✦
                  </div>

                  <strong>
                    Curated Pick
                  </strong>

                  <span>
                    Selected for discovery
                  </span>

                </div>


                <div class="feature">

                  <div class="feature-icon">
                    ↗
                  </div>

                  <strong>
                    Easy Checkout
                  </strong>

                  <span>
                    Continue on retailer
                  </span>

                </div>


                <div class="feature">

                  <div class="feature-icon">
                    ✓
                  </div>

                  <strong>
                    Product Info
                  </strong>

                  <span>
                    Images & details included
                  </span>

                </div>


              </div>



              <!-- ===========================
                   SHARE
              ============================ -->

              <div class="share-row">

                <span class="share-label">
                  Share this find
                </span>


                <button
                  type="button"
                  class="copy-btn"
                  id="copyBtn"
                  onclick="copyProductLink()"
                >
                  Copy Product Link
                </button>

              </div>

            </div>


          </section>



          <!-- ================================
               RELATED
          ================================= -->

          <section
            class="related-section"
            id="relatedSection"
          >

            <div class="section-header">

              <div>

                <div class="eyebrow">
                  More to explore
                </div>

                <h2 class="section-title">
                  You may also like
                </h2>

              </div>


              <a
                href="index.html#products"
                class="section-link"
              >
                View all products →
              </a>

            </div>


            <div
              class="related-grid"
              id="relatedGrid"
            >

            </div>

          </section>


        </div>

      `;


      loadRelatedProducts();

    }


    /* =====================================================
       NOT FOUND
    ===================================================== */

    function showNotFound(){

      app.innerHTML = `

        <div class="state">

          <div class="state-inner">

            <div class="state-icon">
              ?
            </div>

            <h1>
              Product not found
            </h1>

            <p>
              This product may have been removed
              or the link may be incorrect.
            </p>

            <a href="index.html">
              ← Back to products
            </a>

          </div>

        </div>

      `;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(){

      app.innerHTML = `

        <div class="state">

          <div class="state-inner">

            <div class="state-icon">
              !
            </div>

            <h1>
              Something went wrong
            </h1>

            <p>
              Product load nahi ho raha.
              Please try again.
            </p>

            <a href="index.html">
              ← Back to products
            </a>

          </div>

        </div>

      `;

    }


    /* =====================================================
       LOAD PRODUCT
    ===================================================== */

    async function loadProduct(){

      try{

        if(!productId){

          showNotFound();

          return;

        }


        const response =
          await fetch(

            `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(productId)}&select=*`,

            {

              headers:{

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`

              },

              cache:
                "no-store"

            }

          );


        if(!response.ok){

          throw new Error(
            await response.text()
          );

        }


        const data =
          await response.json();


        if(
          !Array.isArray(data) ||
          !data.length
        ){

          showNotFound();

          return;

        }


        currentProduct =
          data[0];


        document.title =
          `WYW HERE | ${currentProduct.name}`;


        /*
         * Dynamic meta description.
         */

        const description =
          document.querySelector(
            'meta[name="description"]'
          );


        if(description){

          description.setAttribute(
            "content",
            currentProduct.description ||
            `Discover ${currentProduct.name} on WYW HERE.`
          );

        }


        renderProduct(
          currentProduct
        );


      }

      catch(error){

        console.error(
          "Product loading error:",
          error
        );

        showError();

      }

    }


    /* =====================================================
       KEYBOARD GALLERY
    ===================================================== */

    document.addEventListener(
      "keydown",
      function(event){

        if(
          galleryImages.length <= 1
        ){

          return;

        }


        if(
          event.key === "ArrowRight"
        ){

          nextImage();

        }


        if(
          event.key === "ArrowLeft"
        ){

          previousImage();

        }

      }
    );


    /* =====================================================
       START
    ===================================================== */

    loadProduct();

  </script>


</body>

</html>
