<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>WYW HERE | Product</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

/* =========================
   PRODUCT DETAIL
========================= */

.detail{

  max-width:1100px;

  margin:60px auto;

  padding:0 6%;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:55px;

  align-items:center;

}


/* =========================
   GALLERY
========================= */

.gallery{

  width:100%;

}


/* MAIN IMAGE */

.detail-image{

  height:500px;

  background:#eee;

  border-radius:25px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  position:relative;

}


.detail-image img{

  width:100%;

  height:100%;

  object-fit:cover;

}


/* PLACEHOLDER */

.placeholder{

  font-size:80px;

  color:#aaa;

}


/* ARROWS */

.gallery-btn{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:42px;

  height:42px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.75);

  color:#fff;

  font-size:22px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:5;

}


.gallery-btn:hover{

  background:#000;

}


.gallery-prev{

  left:15px;

}


.gallery-next{

  right:15px;

}


/* THUMBNAILS */

.thumbnails{

  display:flex;

  gap:10px;

  margin-top:14px;

  overflow-x:auto;

  padding-bottom:5px;

}


.thumbnail{

  width:75px;

  height:75px;

  flex:0 0 75px;

  border-radius:12px;

  overflow:hidden;

  cursor:pointer;

  border:2px solid transparent;

  background:#eee;

}


.thumbnail img{

  width:100%;

  height:100%;

  object-fit:cover;

}


.thumbnail.active{

  border-color:#151515;

}


/* =========================
   PRODUCT INFO
========================= */

.detail-info .tag{

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:2px;

  color:#777;

}


.detail-info h1{

  font-family:"Space Grotesk",sans-serif;

  font-size:52px;

  line-height:1;

  margin:12px 0;

  letter-spacing:-2px;

}


.detail-price{

  font-size:25px;

  font-weight:700;

  margin:18px 0;

}


.detail-desc{

  color:#666;

  line-height:1.7;

  max-width:520px;

}


.buy-large{

  display:inline-block;

  margin-top:25px;

  background:#151515;

  color:#fff;

  text-decoration:none;

  padding:16px 28px;

  border-radius:12px;

  font-weight:700;

}


.back-link{

  display:inline-block;

  margin-top:20px;

  color:#555;

  text-decoration:none;

  font-size:14px;

}


/* NOT FOUND */

.not-found{

  max-width:700px;

  margin:100px auto;

  padding:30px;

  text-align:center;

}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .detail{

    grid-template-columns:1fr;

    margin-top:35px;

    gap:30px;

  }


  .detail-image{

    height:350px;

  }


  .detail-info h1{

    font-size:40px;

  }


  .thumbnail{

    width:65px;

    height:65px;

    flex-basis:65px;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <a
    class="logo"
    href="index.html"
  >
    WYW<span>HERE</span>
  </a>


  <nav>

    <a href="index.html#products">
      Products
    </a>

    <a href="index.html#categories">
      Categories
    </a>

  </nav>

</header>


<main id="content"></main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://ncavpnittrdgylogbjfp.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";


const content =
  document.getElementById("content");


const id =
  new URLSearchParams(
    location.search
  ).get("id");


/* =========================
   GALLERY VARIABLES
========================= */

let galleryImages = [];

let currentImage = 0;


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {

          "&":"&amp;",

          "<":"&lt;",

          ">":"&gt;",

          '"':"&quot;",

          "'":"&#039;"

        }[m];

      }
    );

}


/* =========================
   LOAD PRODUCT
========================= */

async function loadProduct(){

  try{

    if(!id){

      showNotFound();

      return;

    }


    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=*`,

        {

          headers:{

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(!data.length){

      showNotFound();

      return;

    }


    const p =
      data[0];


    document.title =
      "WYW HERE | " + p.name;


    /* =========================
       COLLECT ALL IMAGES
    ========================= */

    galleryImages = [

      p.image_url,

      p.image_2,

      p.image_3,

      p.image_4,

      p.image_5

    ].filter(
      image =>
        image &&
        String(image).trim()
    );


    currentImage = 0;


    /* =========================
       PRODUCT HTML
    ========================= */

    content.innerHTML = `

      <section class="detail">


        <!-- GALLERY -->

        <div class="gallery">


          <div class="detail-image"
               id="mainImageBox">


            ${
              galleryImages.length

              ?

              `

              <img
                id="mainProductImage"
                src="${escapeHtml(galleryImages[0])}"
                alt="${escapeHtml(p.name)}"
              >


              ${
                galleryImages.length > 1

                ?

                `

                <button
                  class="gallery-btn gallery-prev"
                  onclick="previousImage()"
                  aria-label="Previous image"
                >
                  ‹
                </button>


                <button
                  class="gallery-btn gallery-next"
                  onclick="nextImage()"
                  aria-label="Next image"
                >
                  ›
                </button>

                `

                :

                ""

              }

              `

              :

              `<div class="placeholder">
                ✦
              </div>`

            }


          </div>


          ${
            galleryImages.length > 1

            ?

            `

            <div
              class="thumbnails"
              id="thumbnails"
            >

              ${galleryImages.map(
                (image,index) => `

                <div
                  class="thumbnail ${index === 0 ? "active" : ""}"
                  onclick="selectImage(${index})"
                >

                  <img
                    src="${escapeHtml(image)}"
                    alt="Product image ${index + 1}"
                  >

                </div>

              `).join("")}

            </div>

            `

            :

            ""

          }


        </div>


        <!-- PRODUCT INFORMATION -->

        <div class="detail-info">


          <span class="tag">

            ${escapeHtml(p.category)}

          </span>


          <h1>

            ${escapeHtml(p.name)}

          </h1>


          <div class="detail-price">

            ₹${Number(p.price)
              .toLocaleString("en-IN")}

          </div>


          <p class="detail-desc">

            ${escapeHtml(
              p.description || ""
            )}

          </p>


          <a
            class="buy-large"
            href="${escapeHtml(
              p.affiliate_link
            )}"
            target="_blank"
            rel="nofollow sponsored noopener"
          >

            CHECK PRICE / BUY NOW ↗

          </a>


          <br>


          <a
            class="back-link"
            href="index.html"
          >

            ← Back to products

          </a>


        </div>


      </section>

    `;


  }

  catch(error){

    console.error(error);


    content.innerHTML = `

      <div class="not-found">

        <h1>
          Something went wrong
        </h1>

        <p>
          Product load nahi ho raha.
        </p>

        <a
          class="back-link"
          href="index.html"
        >

          ← Back to products

        </a>

      </div>

    `;

  }

}


/* =========================
   SELECT IMAGE
========================= */

function selectImage(index){

  if(
    index < 0 ||
    index >= galleryImages.length
  ){

    return;

  }


  currentImage =
    index;


  updateGallery();

}


/* =========================
   NEXT IMAGE
========================= */

function nextImage(){

  if(galleryImages.length <= 1){

    return;

  }


  currentImage =
    (currentImage + 1)
    % galleryImages.length;


  updateGallery();

}


/* =========================
   PREVIOUS IMAGE
========================= */

function previousImage(){

  if(galleryImages.length <= 1){

    return;

  }


  currentImage =
    (
      currentImage -
      1 +
      galleryImages.length
    )
    % galleryImages.length;


  updateGallery();

}


/* =========================
   UPDATE GALLERY
========================= */

function updateGallery(){

  const mainImage =
    document.getElementById(
      "mainProductImage"
    );


  if(mainImage){

    mainImage.src =
      galleryImages[currentImage];

  }


  document
    .querySelectorAll(".thumbnail")
    .forEach(
      (thumbnail,index) => {

        thumbnail.classList.toggle(
          "active",
          index === currentImage
        );

      }
    );

}


/* =========================
   NOT FOUND
========================= */

function showNotFound(){

  content.innerHTML = `

    <div class="not-found">

      <h1>
        Product not found
      </h1>

      <p>
        Please go back and choose another product.
      </p>

      <a
        class="back-link"
        href="index.html"
      >

        ← Back to products

      </a>

    </div>

  `;

}


/* =========================
   START
========================= */

loadProduct();

</script>

</body>

</html>
