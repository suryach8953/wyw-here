<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="description"
  content="Discover product details, images and the best place to buy."
>

<title>WYW HERE | Product</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

/* =====================================================
   PRODUCT DETAIL — PREMIUM POLISH
===================================================== */

:root{
  --black:#151515;
  --dark:#222;
  --muted:#777;
  --light:#f5f5f2;
  --border:#e8e8e5;
  --white:#fff;
  --radius:24px;
}


/* =====================================================
   PAGE
===================================================== */

.product-page{

  min-height:70vh;

  background:
    radial-gradient(
      circle at 15% 10%,
      #ffffff 0,
      #f8f8f5 35%,
      #f5f5f2 100%
    );

}


/* =====================================================
   BREADCRUMB
===================================================== */

.breadcrumb{

  max-width:1180px;

  margin:0 auto;

  padding:28px 6% 0;

  font-size:13px;

  color:#888;

}


.breadcrumb a{

  color:#555;

  text-decoration:none;

  transition:.2s;

}


.breadcrumb a:hover{

  color:#111;

}


.breadcrumb span{

  margin:0 8px;

  color:#bbb;

}


/* =====================================================
   MAIN DETAIL
===================================================== */

.detail{

  max-width:1180px;

  margin:30px auto 80px;

  padding:0 6%;

  display:grid;

  grid-template-columns:
    minmax(0,1.08fr)
    minmax(0,.92fr);

  gap:70px;

  align-items:start;

}


/* =====================================================
   GALLERY
===================================================== */

.gallery{

  width:100%;

  position:sticky;

  top:25px;

}


.detail-image{

  height:570px;

  background:#eeeeeb;

  border:1px solid var(--border);

  border-radius:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  position:relative;

  box-shadow:
    0 20px 60px rgba(0,0,0,.07);

}


.detail-image::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.18),
      transparent 45%
    );

}


.detail-image img{

  width:100%;

  height:100%;

  object-fit:cover;

  transition:
    opacity .25s ease,
    transform .45s ease;

}


.detail-image:hover img{

  transform:scale(1.025);

}


/* =====================================================
   IMAGE COUNTER
===================================================== */

.image-counter{

  position:absolute;

  left:16px;

  bottom:16px;

  z-index:6;

  padding:7px 11px;

  border-radius:999px;

  background:rgba(0,0,0,.72);

  color:#fff;

  font-size:12px;

  font-weight:700;

  backdrop-filter:blur(8px);

}


/* =====================================================
   PLACEHOLDER
===================================================== */

.placeholder{

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:90px;

  color:#aaa;

}


/* =====================================================
   GALLERY BUTTONS
===================================================== */

.gallery-btn{

  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:46px;

  height:46px;

  border:1px solid rgba(255,255,255,.25);

  border-radius:50%;

  background:rgba(20,20,20,.78);

  color:#fff;

  font-size:28px;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:10;

  transition:
    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease;

  backdrop-filter:blur(8px);

}


.gallery-btn:hover{

  background:#000;

  transform:
    translateY(-50%)
    scale(1.06);

  box-shadow:
    0 8px 25px rgba(0,0,0,.2);

}


.gallery-btn:active{

  transform:
    translateY(-50%)
    scale(.96);

}


.gallery-prev{

  left:18px;

}


.gallery-next{

  right:18px;

}


/* =====================================================
   THUMBNAILS
===================================================== */

.thumbnails{

  display:flex;

  gap:11px;

  margin-top:15px;

  overflow-x:auto;

  padding:3px 2px 8px;

  scrollbar-width:thin;

}


.thumbnail{

  width:78px;

  height:78px;

  flex:0 0 78px;

  border-radius:14px;

  overflow:hidden;

  cursor:pointer;

  border:2px solid transparent;

  background:#eee;

  position:relative;

  transition:
    transform .2s ease,
    border-color .2s ease,
    opacity .2s ease;

}


.thumbnail:hover{

  transform:translateY(-2px);

}


.thumbnail img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}


.thumbnail.active{

  border-color:var(--black);

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);

}


.thumbnail.active::after{

  content:"";

  position:absolute;

  inset:0;

  border-radius:11px;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.3);

}


/* =====================================================
   PRODUCT INFORMATION
===================================================== */

.detail-info{

  padding-top:12px;

}


.detail-info .tag{

  display:inline-flex;

  align-items:center;

  padding:7px 12px;

  border-radius:999px;

  background:#eaeae7;

  color:#555;

  font-size:11px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:1.5px;

}


.detail-info h1{

  font-family:
    "Space Grotesk",
    Arial,
    sans-serif;

  font-size:clamp(38px,5vw,62px);

  line-height:.98;

  margin:20px 0 15px;

  letter-spacing:-3px;

  color:var(--black);

}


.detail-price{

  display:flex;

  align-items:center;

  gap:12px;

  font-size:30px;

  font-weight:800;

  margin:20px 0;

  color:var(--black);

}


.detail-price::after{

  content:"";

  display:inline-block;

  width:45px;

  height:1px;

  background:#ccc;

}


.detail-desc{

  color:#666;

  font-size:16px;

  line-height:1.8;

  max-width:540px;

  margin:22px 0;

}


/* =====================================================
   BUY BOX
===================================================== */

.buy-box{

  margin-top:30px;

  padding:20px;

  border:1px solid var(--border);

  border-radius:18px;

  background:rgba(255,255,255,.72);

  box-shadow:
    0 12px 35px rgba(0,0,0,.045);

}


.buy-note{

  margin:0 0 13px;

  font-size:12px;

  color:#777;

}


.buy-large{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  width:100%;

  min-height:56px;

  background:var(--black);

  color:#fff;

  text-decoration:none;

  padding:16px 24px;

  border-radius:13px;

  font-weight:800;

  letter-spacing:.2px;

  cursor:pointer;

  transition:
    transform .2s ease,
    background .2s ease,
    box-shadow .2s ease;

}


.buy-large:hover{

  background:#000;

  transform:translateY(-2px);

  box-shadow:
    0 12px 25px rgba(0,0,0,.18);

}


.buy-large:active{

  transform:translateY(0);

}


/* =====================================================
   TRUST ROW
===================================================== */

.trust-row{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:14px;

}


.trust-item{

  text-align:center;

  padding:12px 6px;

  border-radius:12px;

  background:#f4f4f1;

  font-size:11px;

  color:#666;

}


.trust-item strong{

  display:block;

  color:#222;

  font-size:12px;

  margin-bottom:3px;

}


/* =====================================================
   BACK LINK
===================================================== */

.back-link{

  display:inline-flex;

  align-items:center;

  gap:7px;

  margin-top:22px;

  color:#555;

  text-decoration:none;

  font-size:14px;

  font-weight:600;

  transition:.2s;

}


.back-link:hover{

  color:#111;

  transform:translateX(-3px);

}


/* =====================================================
   NOT FOUND / ERROR
===================================================== */

.not-found{

  max-width:700px;

  margin:110px auto;

  padding:50px 25px;

  text-align:center;

}


.not-found h1{

  font-size:42px;

  margin-bottom:10px;

}


.not-found p{

  color:#777;

  line-height:1.7;

}


/* =====================================================
   LOADING
===================================================== */

.product-loading{

  max-width:1180px;

  margin:60px auto;

  padding:0 6%;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:70px;

}


.skeleton{

  background:
    linear-gradient(
      90deg,
      #eee 25%,
      #f7f7f5 50%,
      #eee 75%
    );

  background-size:200% 100%;

  animation:
    skeletonLoading 1.4s infinite;

  border-radius:24px;

}


.skeleton-image{

  height:570px;

}


.skeleton-line{

  height:18px;

  margin-bottom:14px;

  border-radius:8px;

}


.skeleton-title{

  width:80%;

  height:55px;

  margin:20px 0;

}


@keyframes skeletonLoading{

  from{
    background-position:200% 0;
  }

  to{
    background-position:-200% 0;
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  .detail{

    grid-template-columns:1fr;

    gap:38px;

    margin-top:25px;

  }


  .gallery{

    position:relative;

    top:auto;

  }


  .detail-image{

    height:min(560px,75vw);

    min-height:350px;

  }


  .detail-info{

    padding-top:0;

  }

}


@media(max-width:600px){

  .breadcrumb{

    padding-top:20px;

  }


  .detail{

    padding:0 5%;

    margin-bottom:55px;

  }


  .detail-image{

    min-height:300px;

    height:92vw;

    border-radius:20px;

  }


  .gallery-btn{

    width:40px;

    height:40px;

    font-size:23px;

  }


  .gallery-prev{

    left:10px;

  }


  .gallery-next{

    right:10px;

  }


  .thumbnail{

    width:65px;

    height:65px;

    flex-basis:65px;

    border-radius:11px;

  }


  .detail-info h1{

    font-size:40px;

    letter-spacing:-2px;

  }


  .detail-price{

    font-size:26px;

  }


  .detail-desc{

    font-size:15px;

    line-height:1.7;

  }


  .buy-box{

    padding:15px;

  }


  .trust-row{

    grid-template-columns:1fr 1fr 1fr;

  }


  .trust-item{

    font-size:10px;

  }


  .trust-item strong{

    font-size:11px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <a
    class="logo"
    href="index.html"
  >
    WYW<span>HERE</span>
  </a>


  <nav>

    <a href="index.html#products">
      Products
    </a>

    <a href="index.html#categories">
      Categories
    </a>

    <a href="index.html#about">

    </a>

  </nav>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="product-page">


  <!-- BREADCRUMB -->

  <div class="breadcrumb">

    <a href="index.html">
      Home
    </a>

    <span>›</span>

    <span>
      Product
    </span>

  </div>


  <!-- CONTENT -->

  <div id="content">

    <div class="product-loading">

      <div class="skeleton skeleton-image"></div>

      <div>

        <div
          class="skeleton"
          style="width:120px;height:30px"
        ></div>

        <div class="skeleton skeleton-title"></div>

        <div
          class="skeleton"
          style="width:180px;height:35px"
        ></div>

        <br>

        <div class="skeleton skeleton-line"></div>

        <div
          class="skeleton skeleton-line"

        ></div>

          class="skeleton skeleton-line"

        ></div>

      </div>

    </div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ncavpnittrdgylogbjfp.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";


const content =
  document.getElementById("content");


const id =
  new URLSearchParams(
    location.search
  ).get("id");


/* =====================================================
   GALLERY
===================================================== */

let galleryImages = [];

let currentImage = 0;

let currentProduct = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[match];

      }
    );

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(value){

  const number =
    Number(value || 0);


  return number.toLocaleString(
    "en-IN",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}


/* =====================================================
   TRACK AFFILIATE CLICK
===================================================== */

async function trackAffiliateClick(){

  try{

    if(!currentProduct){

      return false;

    }


    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/affiliate_clicks`,

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              product_id:
                currentProduct.id,

              product_name:
                currentProduct.name

            }),

          keepalive:true

        }

      );


    return response.ok;

  }

  catch(error){

    console.error(
      "Affiliate tracking error:",
      error
    );

    return false;

  }

}


/* =====================================================
   BUY NOW
===================================================== */

async function handleAffiliateClick(event){

  event.preventDefault();

  event.stopPropagation();


  const button =
    event.currentTarget;


  const affiliateLink =
    button.dataset.affiliateLink;


  if(!affiliateLink){

    alert(
      "Affiliate link is not available."
    );

    return;

  }


  /*
   * Open new tab immediately.
   */

  const newWindow =
    window.open(
      "about:blank",
      "_blank"
    );


  /*
   * Track click.
   */

  await trackAffiliateClick();


  /*
   * Continue to affiliate URL.
   */

  if(newWindow){

    newWindow.location.href =
      affiliateLink;

  }

  else{

    location.href =
      affiliateLink;

  }

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

  try{

    if(!id){

      showNotFound();

      return;

    }


    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=*`,

        {

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`

          }

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    if(!data.length){

      showNotFound();

      return;

    }


    const product =
      data[0];


    currentProduct =
      product;


    document.title =
      `WYW HERE | ${product.name}`;


    /* =================================================
       IMAGES
    ================================================= */

    galleryImages = [

      product.image_url,
      product.image_2,
      product.image_3,
      product.image_4,
      product.image_5

    ].filter(
      image =>
        image &&
        String(image).trim()
    );


    currentImage = 0;


    /* =================================================
       RENDER
    ================================================= */

    content.innerHTML = `

      <section class="detail">


        <!-- GALLERY -->

        <div class="gallery">


          <div
            class="detail-image"
            id="mainImageBox"
          >

            ${
              galleryImages.length

              ?

              `

              <img
                id="mainProductImage"
                src="${escapeHtml(galleryImages[0])}"
                alt="${escapeHtml(product.name)}"
                loading="eager"
              >

              ${
                galleryImages.length > 1

                ?

                `

                <button
                  type="button"
                  class="gallery-btn gallery-prev"
                  onclick="previousImage()"
                  aria-label="Previous image"
                >
                  ‹
                </button>


                <button
                  type="button"
                  class="gallery-btn gallery-next"
                  onclick="nextImage()"
                  aria-label="Next image"
                >
                  ›
                </button>

                `

                :

                ""

              }


              <div
                class="image-counter"
                id="imageCounter"
              >
                1 / ${galleryImages.length}
              </div>

              `

              :

              `

              <div class="placeholder">
                ✦
              </div>

              `

            }

          </div>


          ${
            galleryImages.length > 1

            ?

            `

            <div
              class="thumbnails"
              id="thumbnails"
            >

              ${galleryImages.map(
                (image,index) => `

                  <div
                    class="
                      thumbnail
                      ${
                        index === 0
                          ? "active"
                          : ""
                      }
                    "
                    onclick="selectImage(${index})"
                  >

                    <img
                      src="${escapeHtml(image)}"
                      alt="Product image ${index + 1}"
                      loading="lazy"
                    >

                  </div>

                `
              ).join("")}

            </div>

            `

            :

            ""

          }


        </div>


        <!-- PRODUCT INFO -->

        <div class="detail-info">


          <span class="tag">

            ${escapeHtml(
              product.category ||
              "Featured"
            )}

          </span>


          <h1>

            ${escapeHtml(
              product.name
            )}

          </h1>


          <div class="detail-price">

            ₹${formatPrice(
              product.price
            )}

          </div>


          ${
            product.description

            ?

            `

            <p class="detail-desc">

              ${escapeHtml(
                product.description
              )}

            </p>

            `

            :

            ""

          }


          <div class="buy-box">

            <p class="buy-note">

              Check the latest price and availability.

            </p>


            <a
              class="buy-large"
              href="${escapeHtml(
                product.affiliate_link || "#"
              )}"
              data-affiliate-link="${escapeHtml(
                product.affiliate_link || ""
              )}"
              target="_blank"
              rel="nofollow sponsored noopener"
              onclick="handleAffiliateClick(event)"
            >

              CHECK PRICE / BUY NOW

              <span>↗</span>

            </a>


            <div class="trust-row">

              <div class="trust-item">

                <strong>
                  Curated
                </strong>

                Handpicked

              </div>


              <div class="trust-item">

                <strong>
                  Easy
                </strong>

                Shop online

              </div>


              <div class="trust-item">

                <strong>
                  Updated
                </strong>

                Price may vary

              </div>

            </div>

          </div>


          <a
            class="back-link"
            href="index.html#products"
          >

            ← Back to products

          </a>


        </div>


      </section>

    `;


    if(!product.affiliate_link){

      console.warn(
        "Affiliate link missing."
      );

    }

  }

  catch(error){

    console.error(
      "Product load error:",
      error
    );


    content.innerHTML = `

      <div class="not-found">

        <h1>
          Something went wrong
        </h1>

        <p>
          We couldn't load this product right now.
        </p>

        <a
          class="back-link"
          href="index.html#products"
        >

          ← Back to products

        </a>

      </div>

    `;

  }

}


/* =====================================================
   SELECT IMAGE
===================================================== */

function selectImage(index){

  if(
    index < 0 ||
    index >= galleryImages.length
  ){

    return;

  }


  currentImage =
    index;


  updateGallery();

}


/* =====================================================
   NEXT IMAGE
===================================================== */

function nextImage(){

  if(
    galleryImages.length <= 1
  ){

    return;

  }


  currentImage =
    (
      currentImage + 1
    ) %
    galleryImages.length;


  updateGallery();

}


/* =====================================================
   PREVIOUS IMAGE
===================================================== */

function previousImage(){

  if(
    galleryImages.length <= 1
  ){

    return;

  }


  currentImage =
    (
      currentImage -
      1 +
      galleryImages.length
    ) %
    galleryImages.length;


  updateGallery();

}


/* =====================================================
   UPDATE GALLERY
===================================================== */

function updateGallery(){

  const image =
    document.getElementById(
      "mainProductImage"
    );


  if(image){

    image.style.opacity =
      "0";


    setTimeout(
      () => {

        image.src =
          galleryImages[currentImage];

        image.style.opacity =
          "1";

      },
      120
    );

  }


  document
    .querySelectorAll(".thumbnail")
    .forEach(
      (thumbnail,index) => {

        thumbnail.classList.toggle(
          "active",
          index === currentImage
        );

      }
    );


  const counter =
    document.getElementById(
      "imageCounter"
    );


  if(counter){

    counter.textContent =
      `${currentImage + 1} / ${galleryImages.length}`;

  }

}


/* =====================================================
   KEYBOARD GALLERY
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      !galleryImages.length
    ){

      return;

    }


    if(event.key === "ArrowRight"){

      nextImage();

    }


    if(event.key === "ArrowLeft"){

      previousImage();

    }

  }
);


/* =====================================================
   TOUCH SWIPE
===================================================== */

let touchStartX = 0;

let touchEndX = 0;


document.addEventListener(
  "touchstart",
  event => {

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {passive:true}
);


document.addEventListener(
  "touchend",
  event => {

    touchEndX =
      event.changedTouches[0].screenX;


    const difference =
      touchStartX -
      touchEndX;


    if(
      Math.abs(difference) < 50
    ){

      return;

    }


    if(difference > 0){

      nextImage();

    }

    else{

      previousImage();

    }

  },
  {passive:true}
);
