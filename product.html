<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WYW HERE | Product</title>

<link rel="stylesheet" href="style.css">

<style>

.detail{
  max-width:1100px;
  margin:60px auto;
  padding:0 6%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  align-items:center;
}

.detail-image{
  height:500px;
  background:#eee;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font-size:80px;
  color:#aaa;
}

.detail-info .tag{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:#777;
}

.detail-info h1{
  font-family:"Space Grotesk",sans-serif;
  font-size:52px;
  line-height:1;
  margin:12px 0;
  letter-spacing:-2px;
}

.detail-price{
  font-size:25px;
  font-weight:700;
  margin:18px 0;
}

.detail-desc{
  color:#666;
  line-height:1.7;
  max-width:520px;
}

.buy-large{
  display:inline-block;
  margin-top:25px;
  background:#151515;
  color:#fff;
  text-decoration:none;
  padding:16px 28px;
  border-radius:12px;
  font-weight:700;
}

.back-link{
  display:inline-block;
  margin-top:20px;
  color:#555;
  text-decoration:none;
  font-size:14px;
}

.not-found{
  max-width:700px;
  margin:100px auto;
  padding:30px;
  text-align:center;
}

.loading{
  max-width:700px;
  margin:100px auto;
  padding:30px;
  text-align:center;
  color:#777;
}

@media(max-width:750px){

  .detail{
    grid-template-columns:1fr;
    margin-top:35px;
    gap:30px;
  }

  .detail-image{
    height:350px;
  }

  .detail-info h1{
    font-size:40px;
  }

}

</style>

</head>


<body>


<header class="header">

  <a class="logo" href="index.html">
    WYW<span>HERE</span>
  </a>

  <nav>

    <a href="index.html#products">
      Products
    </a>

    <a href="index.html#categories">
      Categories
    </a>

  </nav>

</header>



<main id="content">

  <div class="loading">
    Loading product...
  </div>

</main>



<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://ncavpnittrdgylogbjfp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7E-WPJlMCarIj-FA3quJAw_Z6XFLWqP";


/* ==========================================
   ELEMENTS
========================================== */

const content =
  document.getElementById("content");


/* ==========================================
   PRODUCT ID
========================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const id =
  params.get("id");


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[match];

      }
    );

}


/* ==========================================
   LOAD PRODUCT
========================================== */

async function loadProduct(){

  try{

    /* No product ID */

    if(!id){

      showNotFound();

      return;

    }


    /* Fetch product from Supabase */

    const response =
      await fetch(

        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=*`,

        {

          method:"GET",

          headers:{

            apikey:
              SUPABASE_KEY

          }

        }

      );


    /* Check response */

    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Unable to load product."
      );

    }


    const products =
      await response.json();


    /* Product doesn't exist */

    if(
      !Array.isArray(products) ||
      products.length === 0
    ){

      showNotFound();

      return;

    }


    const product =
      products[0];


    /* Update browser title */

    document.title =
      "WYW HERE | " +
      product.name;


    /* Safe values */

    const name =
      escapeHtml(
        product.name
      );

    const category =
      escapeHtml(
        product.category
      );

    const description =
      escapeHtml(
        product.description || ""
      );

    const imageUrl =
      escapeHtml(
        product.image_url || ""
      );

    const affiliateLink =
      escapeHtml(
        product.affiliate_link || ""
      );

    const price =
      Number(
        product.price || 0
      ).toLocaleString(
        "en-IN"
      );


    /* Product image */

    const imageHTML =
      imageUrl

      ?

      `
        <img
          src="${imageUrl}"
          alt="${name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        >

        <div
          class="placeholder"
          style="display:none"
        >
          ✦
        </div>
      `

      :

      `
        <div class="placeholder">
          ✦
        </div>
      `;


    /* Product page */

    content.innerHTML = `

      <section class="detail">


        <div class="detail-image">

          ${imageHTML}

        </div>


        <div class="detail-info">


          <span class="tag">

            ${category}

          </span>


          <h1>

            ${name}

          </h1>


          <div class="detail-price">

            ₹${price}

          </div>


          <p class="detail-desc">

            ${description}

          </p>


          ${
            affiliateLink

            ?

            `
              <a
                class="buy-large"
                href="${affiliateLink}"
                target="_blank"
                rel="nofollow sponsored noopener"
              >

                CHECK PRICE / BUY NOW ↗

              </a>
            `

            :

            `
              <p style="color:#999;margin-top:25px">
                Affiliate link not available.
              </p>
            `
          }


          <br>


          <a
            class="back-link"
            href="index.html"
          >

            ← Back to products

          </a>


        </div>


      </section>

    `;


  }

  catch(error){

    console.error(
      "Product Error:",
      error
    );


    content.innerHTML = `

      <div class="not-found">

        <h1>
          Something went wrong
        </h1>

        <p>
          Product load nahi ho raha.
        </p>

        <a
          class="back-link"
          href="index.html"
        >

          ← Back to products

        </a>

      </div>

    `;

  }

}


/* ==========================================
   PRODUCT NOT FOUND
========================================== */

function showNotFound(){

  content.innerHTML = `

    <div class="not-found">

      <h1>
        Product not found
      </h1>

      <p>
        Please go back and choose another product.
      </p>

      <a
        class="back-link"
        href="index.html"
      >

        ← Back to products

      </a>

    </div>

  `;

}


/* ==========================================
   START
========================================== */

loadProduct();

</script>


</body>
</html>
